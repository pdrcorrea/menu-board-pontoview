<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PontoView Menu Board</title>
  <style>
    :root {
      --header: #173463;
      --accent: #00b9f2;
      --price: #173463;
      --ink: #162237;
      --muted: #68778c;
      --background: #f4f7fb;
      --surface: #ffffff;
      --line: #e2eaf2;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 0 0, color-mix(in srgb, var(--accent) 14%, transparent), transparent 32%),
        var(--background);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(16px, 2vh, 32px);
      padding: clamp(20px, 3vw, 52px);
    }

    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .mark {
      width: clamp(46px, 4vw, 72px); height: clamp(46px, 4vw, 72px);
      display: grid; place-items: center; flex: none;
      border-radius: 17px; background: var(--header); color: #fff;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--header) 18%, transparent);
      font-size: clamp(19px, 1.8vw, 31px); font-weight: 800;
    }
    .mark img { display: none; width: 76%; height: 76%; object-fit: contain; }
    .mark.has-image img { display: block; }
    .mark.has-image .mark-text { display: none; }
    .title { font-size: clamp(28px, 3.1vw, 54px); font-weight: 800; letter-spacing: -.06em; line-height: .92; }
    .subtitle { margin-top: 7px; color: var(--muted); font-size: clamp(12px, 1.2vw, 19px); font-weight: 600; }
    .subtitle:empty { display: none; }

    #stage { position: relative; min-height: 0; overflow: hidden; }
    .page {
      position: absolute; inset: 0;
      display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      gap: clamp(14px, 1.5vw, 28px);
      opacity: 0; transform: translateY(12px); pointer-events: none;
      transition: opacity .45s ease, transform .45s cubic-bezier(.2,.75,.3,1);
    }
    .page.active { opacity: 1; transform: none; }
    .category {
      min-height: 0; overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--header) 13%, #fff);
      border-radius: 18px; background: var(--surface);
      box-shadow: 0 12px 30px color-mix(in srgb, var(--header) 8%, transparent);
    }
    .category-title {
      display: flex; align-items: center; gap: 11px;
      padding: clamp(15px, 1.5vw, 24px) clamp(17px, 1.7vw, 28px);
      background: var(--header); color: #fff;
      font-size: clamp(17px, 1.5vw, 25px); font-weight: 800;
    }
    .category-title::before { content: ""; width: 7px; height: 1.1em; flex: none; border-radius: 9px; background: var(--accent); }
    .items { padding: clamp(8px, 1vw, 17px) clamp(17px, 1.7vw, 28px); }
    .product {
      display: grid; grid-template-columns: 1fr auto; align-items: center;
      gap: 4px 14px; padding: clamp(11px, 1.15vw, 19px) 0;
      border-bottom: 1px solid var(--line);
    }
    .product:last-child { border: 0; }
    .product.featured { margin: 5px -8px; padding: 12px 8px; border: 0; border-radius: 12px; background: color-mix(in srgb, var(--accent) 11%, #fff); }
    .product-name { font-size: clamp(16px, 1.35vw, 22px); font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
    .description { color: var(--muted); font-size: clamp(11px, .92vw, 15px); }
    .price { grid-area: 1 / 2 / span 2; color: var(--price); font-size: clamp(19px, 1.65vw, 29px); font-weight: 800; white-space: nowrap; }
    .tag { display: inline-block; margin-bottom: 5px; color: color-mix(in srgb, var(--header) 78%, #000); font-size: 9px; font-weight: 800; letter-spacing: .08em; }
    .message { height: 100%; display: grid; place-items: center; padding: 30px; border-radius: 18px; background: #fff; font-weight: 700; text-align: center; }

    footer { color: var(--muted); font-size: clamp(9px, .8vw, 13px); font-weight: 600; }
    #footerMessage:empty { display: none; }
    .dots { display: flex; align-items: center; gap: 7px; }
    .dots i { width: 6px; height: 6px; border-radius: 20px; background: #c6d4e1; transition: width .3s ease, background .3s ease; }
    .dots i.active { width: 20px; background: var(--accent); }
    .pontoview { color: #173463; font-weight: 800; letter-spacing: .03em; }

    @media (orientation: portrait) {
      main { padding: 20px; gap: 17px; }
      .category { border-radius: 16px; }
    }

    /* Visual de sinalização: legível à distância, inclusive em TVs HD de 32". */
    main { padding: clamp(16px, 2.2vw, 34px); gap: clamp(10px, 1.7vh, 22px); }
    .title { font-size: clamp(30px, 3vw, 52px); line-height: 1.05; letter-spacing: -.04em; }
    .subtitle { font-size: clamp(15px, 1.2vw, 20px); margin-top: 4px; }
    .mark { width: clamp(48px, 4vw, 70px); height: clamp(48px, 4vw, 70px); }
    .page { gap: clamp(14px, 1.5vw, 28px); }
    .category { border-radius: 18px; box-shadow: 0 5px 20px color-mix(in srgb, var(--header) 7%, transparent); display: flex; flex-direction: column; }
    .category-title { min-height: clamp(60px, 8vh, 86px); padding: 14px clamp(18px, 2vw, 34px); font-size: clamp(23px, 2vw, 35px); line-height: 1.1; }
    .category-title::before { width: 6px; height: 1.05em; }
    .items { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; min-height: 0; padding: 10px clamp(20px, 2vw, 36px); }
    .product { flex: 1; min-height: 0; grid-template-columns: minmax(0,1fr) auto; column-gap: 18px; row-gap: 5px; padding: 10px 0; align-content: center; }
    .product-name { font-size: clamp(27px, 2.25vw, 43px); font-weight: 750; line-height: 1.12; overflow-wrap: anywhere; }
    .description { font-size: clamp(14px, 1.13vw, 20px); line-height: 1.2; }
    .description:empty { display: none; }
    .price { font-size: clamp(31px, 2.55vw, 48px); font-weight: 800; line-height: 1.1; letter-spacing: -.04em; }
    .product.featured { margin: 3px -10px; padding: 10px; }
    .tag { font-size: clamp(11px, .85vw, 15px); }
    footer { font-size: clamp(11px, .95vw, 15px); gap: 15px; }
    .pontoview { white-space: nowrap; }
    @media (max-width: 1500px) and (orientation: landscape) {
      .product-name { font-size: clamp(26px, 2.35vw, 35px); }
      .price { font-size: clamp(30px, 2.8vw, 41px); }
      .description { font-size: clamp(14px, 1.3vw, 18px); }
      .category-title { font-size: clamp(24px, 2.2vw, 31px); }
    }
    @media (orientation: portrait) {
      main { padding: clamp(16px, 3vw, 32px); }
      .product-name { font-size: clamp(25px, 3.4vw, 42px); }
      .price { font-size: clamp(29px, 3.8vw, 46px); }
      .category-title { font-size: clamp(25px, 3vw, 36px); }
      .description { font-size: clamp(15px, 2vw, 21px); }
    }
    @media (max-width: 650px) {
      .product-name { font-size: clamp(19px, 3.8vw, 28px); }
      .price { font-size: clamp(22px, 4.3vw, 32px); }
      .items { padding-inline: 15px; }
      footer .pontoview { display: none; }
      .category-title { min-height: 56px; }
    }

    /* Painel de preços com leitura a distância: tabela, marca e rodapé. */
    :root { --ink:#f8fbff; --muted:#b9cbe0; --surface:#112943; --line:#365673; }
    body { background:#071523; color:var(--ink); font-family:Arial,"Segoe UI",sans-serif; }
    main { height:100dvh; grid-template-rows:auto minmax(0,1fr) auto; padding:0; gap:0; }
    header { min-height:clamp(78px,12vh,120px); padding:12px clamp(20px,2.5vw,46px); background:var(--header); border-bottom:5px solid var(--accent); }
    header .title { font-size:clamp(30px,3.45vw,62px); line-height:1.08; letter-spacing:-.025em; color:white; }
    header .subtitle { font-size:clamp(13px,1.2vw,20px); color:#e0eaf6; }
    header .mark { display:none; }
    #stage { margin:clamp(12px,1.7vh,22px) clamp(14px,1.7vw,32px); }
    .page { display:grid; grid-template-columns:minmax(0,1fr) minmax(190px,23%); gap:clamp(12px,1.5vw,28px); transform:none; }
    .category { display:flex; flex-direction:column; overflow:hidden; border:2px solid #315270; border-radius:7px; background:#10283e; box-shadow:none; }
    .category-title { flex:0 0 auto; min-height:clamp(54px,8vh,84px); padding:8px clamp(20px,2vw,36px); font-size:clamp(29px,2.9vw,52px); background:#204f84; color:#fff; letter-spacing:.015em; text-transform:uppercase; }
    .category-title::before { display:none; }
    .table-head { display:grid; grid-template-columns:minmax(0,1fr) auto; padding:8px clamp(18px,2vw,36px); background:#0b2035; color:#b6d7fa; font-weight:800; font-size:clamp(14px,1.15vw,20px); text-transform:uppercase; }
    .items { flex:1; display:flex; flex-direction:column; min-height:0; padding:0; background:#eaf2fa; }
    .product { flex:1; display:grid; grid-template-columns:minmax(0,1fr) auto; align-content:center; gap:0 clamp(12px,2vw,32px); margin:0; padding:8px clamp(18px,2vw,36px); border:0; border-bottom:2px solid #bad0e2; background:#edf4fb; }
    .product:nth-child(even) { background:#d8e8f5; }
    .product:last-child { border:0; }
    .product.featured { margin:0; padding:8px clamp(18px,2vw,36px); border-radius:0; background:#c5e2f7; }
    .product-name { color:#10263e; font-size:clamp(25px,2.85vw,49px); font-weight:800; line-height:1.05; letter-spacing:-.025em; overflow-wrap:anywhere; }
    .description { color:#52677c; font-size:clamp(12px,1.05vw,17px); line-height:1.12; }
    .price { grid-area:1/2/span 2; color:#0c3d77; font-size:clamp(27px,3.15vw,54px); line-height:1; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.04em; }
    .tag { color:#0b538c; font-size:11px; margin:0 7px 0 0; }
    .side-panel { min-width:0; display:flex; flex-direction:column; justify-content:space-between; gap:14px; border:2px solid #315270; border-radius:7px; background:linear-gradient(165deg,#173b60,#0b1d31); padding:clamp(15px,2vw,34px); }
    .side-brand { display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; }
    .side-brand .mark { display:grid; width:clamp(80px,10vw,160px); height:clamp(80px,10vw,160px); border-radius:22px; box-shadow:none; background:#fff; color:#173463; font-size:clamp(30px,4vw,60px); }
    .side-heading { color:#dbefff; font-weight:900; font-size:clamp(19px,2vw,36px); line-height:1.1; }
    .side-promo { border-top:2px solid #477397; padding-top:20px; text-align:center; }
    .side-promo-label { display:block; font-size:clamp(12px,1.1vw,19px); font-weight:900; letter-spacing:.09em; color:#90d9ff; text-transform:uppercase; }
    .side-promo-name { margin:12px 0; color:#fff; font-size:clamp(20px,2.1vw,37px); font-weight:900; overflow-wrap:anywhere; }
    .side-promo-price { font-size:clamp(28px,3.1vw,54px); font-weight:900; color:#ffe174; white-space:nowrap; }
    footer { min-height:clamp(44px,6.5vh,74px); padding:8px clamp(18px,2.3vw,40px); background:var(--header); color:#fff; border-top:3px solid var(--accent); font-size:clamp(13px,1.2vw,20px); }
    .pontoview { color:#cde6ff; }
    .dots i { background:#6890b6; }.dots i.active { background:#fff; }
    .message { background:#132f4e; color:#fff; }
    @media (orientation:portrait) {
      .page { grid-template-columns:minmax(0,1fr); }
      .side-panel { display:none; }
      header .mark { display:grid; }
      .product-name { font-size:clamp(24px,3.5vw,45px); }
      .price { font-size:clamp(26px,3.8vw,50px); }
    }
    @media (max-width:900px) and (orientation:landscape) {
      .page { grid-template-columns:minmax(0,1fr) 21%; }
      .side-panel { padding:12px; }
      .side-brand .mark { width:65px;height:65px; }
      .side-heading { font-size:18px; }
      .side-promo-name { font-size:18px; }
      .side-promo-price { font-size:22px; }
      .product-name { font-size:clamp(20px,2.6vw,29px); }
      .price { font-size:clamp(22px,2.8vw,32px); }
    }


    /* Logomarca em preenchimento total, sem a antiga moldura branca. */
    .side-brand .mark { overflow:hidden; padding:0; background:transparent; border-radius:22px; }
    .side-brand .mark img { display:block; width:100%; height:100%; object-fit:cover; border-radius:inherit; }
    /* Transição discreta, sem movimento excessivo ou flashes na sinalização. */
    .page { opacity:0; transform:translateY(14px) scale(.99); filter:blur(3px);
      transition:opacity .65s ease, transform .65s cubic-bezier(.16,1,.3,1),filter .65s ease; }
    .page.active { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
    @media (prefers-reduced-motion:reduce) {
      .page { transition:opacity .2s linear; transform:none; filter:none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <div class="mark" id="brandMark">
          <span class="mark-text" id="brandText">PV</span>
          <img id="brandImage" alt="">
        </div>
        <div>
          <div class="title" id="businessName">Seu estabelecimento</div>
          <div class="subtitle" id="subtitle">Cardápio &amp; preços</div>
        </div>
      </div>
    </header>

    <section id="stage"><div class="message">Carregando cardápio…</div></section>

    <footer>
      <span id="footerMessage">Preços em Reais (R$). Venda de bebidas alcoólicas proibida a menores de 18 anos.</span>
      <span class="dots" id="dots"></span>
      <span id="pageCount"></span>
      <span class="pontoview">PontoView</span>
    </footer>
  </main>

  <script>
    const CONFIG = {
      spreadsheetUrl: "https://docs.google.com/spreadsheets/d/13mCv4IJSZKkWJXvoBHqheZzOG5VrYou5ZylnxpUpRrI/edit?usp=sharing"
    };

    const DEFAULTS = {
      businessName: "Seu estabelecimento",
      subtitle: "Cardápio & preços",
      initial: "PV",
      footer: "Preços em Reais (R$). Venda de bebidas alcoólicas proibida a menores de 18 anos.",
      highlightColor: "#0C3D77",
      accentColor: "#00B9F2",
      headerColor: "#102A49",
      backgroundColor: "#071523",
      pageSeconds: 9,
      refreshSeconds: 20,
      itemsPerCategory: 7,
      landscapeCards: 3,
      portraitCards: 1
    };

    const state = { controls: {}, pages: [], currentPage: 0, rotationTimer: null, refreshTimer: null, refreshing: false };
    const byId = id => document.getElementById(id);
    const normalize = value => String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
    const escapeHtml = value => { const node = document.createElement("div"); node.textContent = value ?? ""; return node.innerHTML; };

    function getSheetIdentity() {
      const id = (CONFIG.spreadsheetUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/) || [])[1];
      const gid = (CONFIG.spreadsheetUrl.match(/[?#&]gid=(\d+)/) || [])[1] || "0";
      if (!id) throw new Error("Cole o link normal da planilha na configuração do arquivo.");
      return { id, gid };
    }

    function querySheet(sheetName = "") {
      const { id, gid } = getSheetIdentity();
      return new Promise((resolve, reject) => {
        const callback = `pontoView_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
        const selector = sheetName ? `sheet=${encodeURIComponent(sheetName)}` : `gid=${gid}`;
        const tqx = encodeURIComponent(`out:json;responseHandler:${callback}`);
        const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?${selector}&headers=1&tqx=${tqx}&cache=${Date.now()}`;
        const script = document.createElement("script");
        const timeout = setTimeout(() => finish(new Error("A planilha demorou para responder.")), 12000);

        function finish(error, response) {
          clearTimeout(timeout);
          script.remove();
          delete window[callback];
          error ? reject(error) : resolve(response);
        }

        window[callback] = response => {
          if (response.status === "error") finish(new Error(`Não foi possível ler a aba ${sheetName || "Produtos"}.`));
          else finish(null, response);
        };
        script.onerror = () => finish(new Error("Não foi possível ler a planilha. Confira o compartilhamento."));
        script.src = url;
        document.head.appendChild(script);
      });
    }

    function tableToObjects(table) {
      const headers = table.cols.map(column => normalize(column.label));
      return table.rows.map(row => Object.fromEntries(headers.map((header, index) => [header, row.c[index]?.v ?? ""])));
    }

    function controlsFromTable(table) {
      const controls = {};
      for (const row of table.rows) {
        const key = normalize(row.c?.[0]?.v);
        if (key) controls[key] = row.c?.[1]?.v ?? "";
      }
      return controls;
    }

    function controlText(key, fallback) {
      return Object.prototype.hasOwnProperty.call(state.controls, key) ? String(state.controls[key] ?? "").trim() : fallback;
    }

    function controlNumber(key, fallback) {
      const value = Number(String(state.controls[key] ?? "").replace(",", "."));
      return Number.isFinite(value) && value > 0 ? value : fallback;
    }

    function controlColor(key, fallback) {
      const value = String(state.controls[key] ?? "").trim();
      return /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
    }

    function imageUrl(value) {
      const url = String(value ?? "").trim();
      if (!url) return "";
      const driveId = (url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || [])[1];
      return driveId ? `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000` : url;
    }

    function formatPrice(value) {
      let number;
      if (typeof value === "number") number = value;
      else {
        const text = String(value ?? "").replace("R$", "").trim();
        number = Number(text.includes(",") ? text.replace(/\./g, "").replace(",", ".") : text);
      }
      return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number.isFinite(number) ? number : 0);
    }

    async function loadData() {
      const [productsResponse, controlsResponse] = await Promise.all([
        querySheet(),
        querySheet("Painel de Controle")
      ]);
      state.controls = controlsFromTable(controlsResponse.table);
      return tableToObjects(productsResponse.table).filter(product => String(product.exibir).trim().toUpperCase() === "SIM");
    }

    function applyControls() {
      const root = document.documentElement;
      root.style.setProperty("--price", controlColor("cor de destaque", DEFAULTS.highlightColor));
      root.style.setProperty("--accent", controlColor("cor de acento", DEFAULTS.accentColor));
      root.style.setProperty("--header", controlColor("cor do cabecalho", DEFAULTS.headerColor));
      root.style.setProperty("--background", controlColor("cor de fundo", DEFAULTS.backgroundColor));
      byId("businessName").textContent = controlText("nome do estabelecimento", DEFAULTS.businessName);
      byId("subtitle").textContent = controlText("subtitulo", DEFAULTS.subtitle);
      byId("brandText").textContent = controlText("inicial", DEFAULTS.initial).slice(0, 2).toUpperCase();
      byId("footerMessage").textContent = controlText("mensagem no rodape", DEFAULTS.footer);

      const badge = byId("brandMark");
      const badgeImage = byId("brandImage");
      const configuredImage = imageUrl(controlText("imagem do badge", ""));
      badge.classList.remove("has-image");
      badgeImage.removeAttribute("src");
      if (configuredImage) {
        badgeImage.onload = () => { badge.classList.add("has-image"); document.querySelectorAll(".side-brand .mark").forEach(mark => { mark.innerHTML = `<img src="${escapeHtml(badgeImage.src)}" alt="" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit">`; }); };
        badgeImage.onerror = () => badge.classList.remove("has-image");
        badgeImage.src = configuredImage;
      }
    }

    function buildPages(products) {
      const landscape = innerWidth >= innerHeight;
      const cardsPerPage = 1; // Uma tabela por página: máxima leitura a distância.
      const requestedItems = Math.floor(controlNumber("itens por categoria por pagina", DEFAULTS.itemsPerCategory));
      // Limita a quantidade segundo a altura útil, evitando textos cortados.
      const availableHeight = Math.max(280, byId("stage").clientHeight - 85);
      const itemHeight = landscape ? (innerHeight <= 800 ? 69 : 88) : 110;
      const safeItems = Math.max(2, Math.floor(availableHeight / itemHeight));
      const itemsPerCategory = Math.max(1, Math.min(requestedItems, safeItems, 8));
      const groups = products.reduce((result, product) => {
        const category = String(product.categoria || "Outros").trim() || "Outros";
        (result[category] ||= []).push(product);
        return result;
      }, {});
      const cards = [];
      for (const [category, items] of Object.entries(groups)) {
        for (let index = 0; index < items.length; index += itemsPerCategory) {
          cards.push({ category, items: items.slice(index, index + itemsPerCategory) });
        }
      }
      return Array.from({ length: Math.ceil(cards.length / cardsPerPage) }, (_, index) => ({
        columns: cardsPerPage,
        cards: cards.slice(index * cardsPerPage, index * cardsPerPage + cardsPerPage)
      }));
    }

    function productTemplate(product) {
      const featured = String(product.destaque).trim().toUpperCase() === "SIM";
      return `<div class="product ${featured ? "featured" : ""}">
        <div class="product-name">${featured ? '<span class="tag">DESTAQUE</span><br>' : ""}${escapeHtml(product.produto || "Produto")}</div>
        <div class="description">${escapeHtml(product.descricao)}</div>
        <div class="price">${formatPrice(product.preco)}</div>
      </div>`;
    }

    function render(products) {
      applyControls();
      state.pages = buildPages(products);
      state.currentPage = 0;
      clearTimeout(state.rotationTimer);

      if (!state.pages.length) {
        byId("stage").innerHTML = '<div class="message">Nenhum produto disponível no momento.</div>';
        byId("dots").innerHTML = "";
        byId("pageCount").textContent = "";
        return;
      }

      const featuredProduct = products.find(product => String(product.destaque).trim().toUpperCase() === "SIM");
      byId("stage").innerHTML = state.pages.map((page, pageIndex) => `
        <section class="page ${pageIndex === 0 ? "active" : ""}" style="--columns:${page.columns}">
          ${page.cards.map(card => `<article class="category">
            <div class="category-title">${escapeHtml(card.category)}</div>
            <div class="table-head"><span>Produto</span><span>Preço</span></div>
            <div class="items">${card.items.map(productTemplate).join("")}</div>
          </article>`).join("")}
          <aside class="side-panel"><div class="side-brand"><div class="mark" id="pageMark${pageIndex}">${escapeHtml(controlText("inicial", DEFAULTS.initial).slice(0,2).toUpperCase())}</div><div class="side-heading">${escapeHtml(controlText("nome do estabelecimento", DEFAULTS.businessName))}</div></div>${featuredProduct ? `<div class="side-promo"><span class="side-promo-label">Destaque do cardápio</span><div class="side-promo-name">${escapeHtml(featuredProduct.produto)}</div><div class="side-promo-price">${formatPrice(featuredProduct.preco)}</div></div>` : `<div class="side-promo"><span class="side-promo-label">Nosso cardápio</span><div class="side-promo-name">Escolha seu favorito</div></div>`}</aside>
        </section>`).join("");
      const logo = byId("brandImage");
      if (logo.src && byId("brandMark").classList.contains("has-image")) {
        document.querySelectorAll(".side-brand .mark").forEach(mark => { mark.innerHTML = `<img src="${escapeHtml(logo.src)}" alt="" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit">`; });
      }
      byId("dots").innerHTML = state.pages.map((_, index) => `<i class="${index === 0 ? "active" : ""}"></i>`).join("");
      showPage(0);
      scheduleRotation();
    }

    function showPage(index) {
      const elements = [...document.querySelectorAll(".page")];
      if (!elements.length) return;
      elements[state.currentPage]?.classList.remove("active");
      state.currentPage = (index + state.pages.length) % state.pages.length;
      elements[state.currentPage]?.classList.add("active");
      [...byId("dots").children].forEach((dot, dotIndex) => dot.classList.toggle("active", dotIndex === state.currentPage));
      byId("pageCount").textContent = state.pages.length > 1 ? `${state.currentPage + 1} / ${state.pages.length}` : "";
    }

    // O ciclo completo é a unidade de atualização: nunca interromper uma página.
    function scheduleRotation() {
      clearTimeout(state.rotationTimer);
      const seconds = controlNumber("tempo por pagina (segundos)", DEFAULTS.pageSeconds);
      state.rotationTimer = setTimeout(async () => {
        if (state.refreshing) return;
        if (state.currentPage < state.pages.length - 1) {
          showPage(state.currentPage + 1);
          scheduleRotation();
        } else {
          // A última página permaneceu visível por todo o tempo configurado.
          await refresh({ preserveOnError: true });
        }
      }, seconds * 1000);
    }

    async function refresh({ preserveOnError = false } = {}) {
      if (state.refreshing) return;
      state.refreshing = true;
      clearTimeout(state.rotationTimer);
      try {
        const products = await loadData();
        render(products); // Reinicia a sequência somente após a última página.
      } catch (error) {
        console.error(error);
        if (!preserveOnError || !state.pages.length) {
          byId("stage").innerHTML = `<div class="message">${escapeHtml(error.message)}</div>`;
        }
        // Se houver erro, mantém o cardápio exibido e tenta novamente sem travar.
        state.rotationTimer = setTimeout(() => refresh({ preserveOnError: true }), 30000);
      } finally {
        state.refreshing = false;
      }
    }

        let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => refresh({ preserveOnError: true }), 300);
    });

    refresh();
  </script>
</body>
</html>
